<!-- ============================================
   Caminho: frontend/pages/cadastro.html
   Objetivo: Formulário de cadastro (novo layout)
   ============================================ -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="cadastro.titulo">Cadastro de Usuário</title>
  <link rel="stylesheet" href="../styles/style.css" />
</head>
<body>
  <div id="cabecalho-container"></div>

  <main class="container">
    <h2 data-i18n="cadastro.heading">Cadastro</h2>

    <form id="form-cadastro" class="form-grid">
      <!-- =============================
           Identificação
         ============================= -->
      <fieldset class="grupo">
        <legend data-i18n="cadastro.secao.identificacao">Identificação</legend>

        <label for="nomeCompleto" data-i18n="cadastro.nomeCompleto">Nome completo:</label>
        <input id="nomeCompleto" name="nomeCompleto" type="text" placeholder="Ex.: Maria Silva" autocomplete="name" required />

        <label for="nomeSocial" data-i18n="cadastro.nomeSocial">Nome social / Apelido:</label>
        <input id="nomeSocial" name="nomeSocial" type="text" placeholder="(opcional)" autocomplete="nickname" />

        <label for="dataNascimento" data-i18n="cadastro.dataNascimento">Data de nascimento:</label>
        <input id="dataNascimento" name="dataNascimento" type="date" required />
      </fieldset>

      <!-- =============================
           Endereço
         ============================= -->
      <fieldset class="grupo">
        <legend data-i18n="cadastro.secao.endereco">Endereço</legend>

        <label for="cep" data-i18n="cadastro.cep">CEP:</label>
        <input
          id="cep" name="cep" type="text"
          inputmode="numeric" autocomplete="postal-code"
          placeholder="00000-000" maxlength="9"
          pattern="\d{5}-\d{3}" title="Use o formato 00000-000" required
        />

        <label for="logradouro" data-i18n="cadastro.logradouro">Rua/Av.:</label>
        <input id="logradouro" name="logradouro" type="text" placeholder="Ex.: Av. Paulista" autocomplete="address-line1" required />

        <label for="numero" data-i18n="cadastro.numero">Número / Complemento:</label>
        <input id="numero" name="numero" type="text" placeholder="Ex.: 123" autocomplete="address-line2" required />

        <label for="bairro" data-i18n="cadastro.bairro">Bairro:</label>
        <input id="bairro" name="bairro" type="text" placeholder="Ex.: Centro" autocomplete="address-level3" required />

        <label for="cidade" data-i18n="cadastro.cidade">Cidade:</label>
        <input id="cidade" name="cidade" type="text" placeholder="Ex.: São Paulo" autocomplete="address-level2" required />

        <label for="estado" data-i18n="cadastro.estado">Estado:</label>
        <select id="estado" name="estado" autocomplete="address-level1" required>
          <option value="" disabled selected data-i18n="cadastro.estado.selecione">Selecione</option>
          <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
          <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
          <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
          <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
          <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
          <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
          <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
          <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
          <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
        </select>
      </fieldset>

      <!-- =============================
           Contatos
         ============================= -->
      <fieldset class="grupo">
        <legend data-i18n="cadastro.secao.contatos">Contatos</legend>

        <label for="telefone" data-i18n="cadastro.telefone">Telefone:</label>
        <input id="telefone" name="telefone" type="tel" inputmode="tel" placeholder="(00) 00000-0000" autocomplete="tel" />

        <label for="email" data-i18n="cadastro.email">E-mail:</label>
        <input id="email" name="email" type="email" placeholder="exemplo@dominio.com" autocomplete="email" />

        <label for="redeSocial" data-i18n="cadastro.redeSocial">Rede social:</label>
        <input id="redeSocial" name="redeSocial" type="text" placeholder="@usuario ou URL" autocomplete="url" />
      </fieldset>

      <!-- =============================
           Status
         ============================= -->
      <fieldset class="grupo">
        <legend data-i18n="cadastro.secao.status">Status</legend>

        <label for="status" data-i18n="cadastro.status">Status:</label>
        <select id="status" name="status" required>
          <option value="ativo" selected data-i18n="cadastro.status.ativo">Ativo</option>
          <option value="desativado" data-i18n="cadastro.status.desativado">Desativado</option>
        </select>
      </fieldset>

      <!-- =============================
           Ações do formulário
         ============================= -->
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" data-i18n="cadastro.btn.salvar">Salvar</button>
        <button type="reset" class="btn btn-secondary" data-i18n="cadastro.btn.limpar">Limpar</button>
      </div>
    </form>
  </main>

  <div id="rodape-container"></div>


   <!-- ===== Modal de Aviso (inline) ===== -->
<div id="modalAviso" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalAvisoTitulo">
  <div class="modal-box">
    <h2 id="modalAvisoTitulo" data-i18n="modalAviso.titulo">Aviso</h2>

    <div id="modalAvisoMsg" class="modal-msg hidden" role="alert" aria-live="polite"></div>
    <div id="modalAvisoDetalhes" class="hidden" style="margin-top:.75rem;"></div>

    <div class="form-actions" style="justify-content:flex-end;">
      <button type="button" id="modalAvisoBtnFechar" class="btn btn-secondary" data-i18n="modalAviso.btn.fechar">Fechar</button>
    </div>
  </div>
</div>

<!-- ===== /Modal de Aviso ===== -->


  <!-- Scripts -->
  <script type="module" src="../scripts/incluirComponentes.js"></script>

  <script type="module">
    import { renderizarCalendario } from "../scripts/calendarioPresencas.js";
    window.renderizarCalendario = renderizarCalendario;
  </script>

  <!-- Modal logic (requer modal no DOM) -->
  <script type="module" src="../scripts/modalAviso.js"></script>

  <!-- Form logic (chama abrirModalEditarUsuario no sucesso) -->
  <script type="module" src="../scripts/cadastro.js"></script>
</body>
</html>
