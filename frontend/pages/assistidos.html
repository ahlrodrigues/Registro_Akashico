<!-- ============================================
   Caminho: frontend/pages/assistidos.html
   Objetivo: Listagem simples de assistidos (sem coluna adicional)
   Requisitos:
   - CSS global em ../styles/style.css
   - Script de listagem em ../scripts/assistidos.js
   - Cabeçalho via incluirComponentes.js (opcional)
   ============================================ -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="assistidos.titulo">Assistidos</title>
  <link rel="stylesheet" href="../styles/style.css" />
  <script type="module" src="../scripts/assistidos.js" defer></script>
</head>
<body>
  <div id="cabecalho-container"></div>

  <main>
    <table id="tabelaAssistidos">
      <thead>
        <tr>
          <th>ID</th>
          <th data-i18n="assistidos.nome">Nome</th>
          <th data-i18n="assistidos.apelido">Apelido</th>
          <th data-i18n="assistidos.telefone">Telefone</th>
          <th data-i18n="assistidos.email">Email</th>
          <th data-i18n="assistidos.status">Status</th>
        </tr>
      </thead>
      <tbody>
        <!-- Preenchido via JS -->
      </tbody>
    </table>
  </main>

  <script type="module" src="../scripts/incluirComponentes.js"></script>
</body>
</html>
