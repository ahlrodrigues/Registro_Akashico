<!-- ============================================
  PATH: frontend/components/modalAviso.html
  OBJ: Modal genérico de aviso (sucesso/erro/warn/info)
  Depende do style.css (.modal, .modal-box, .modal-msg, .btn*)
=============================================== -->
<div id="modalAviso" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalAvisoTitulo">
  <div class="modal-box">
    <h2 id="modalAvisoTitulo" data-i18n="modalAviso.titulo">Aviso</h2>

    <div id="modalAvisoMsg" class="modal-msg hidden" role="alert" aria-live="polite"></div>

    <div id="modalAvisoDetalhes" class="hidden" style="margin-top: .75rem;"></div>

    <div class="form-actions" style="justify-content: flex-end;">
      <button type="button" id="modalAvisoBtnFechar" class="btn btn-secondary" data-i18n="modalAviso.btn.fechar">Fechar</button>
    </div>
  </div>
</div>
